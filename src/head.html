<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIFE ROAD</title>
<style>
:root{--ink:#3b2f4a;--card:#fffdf7;--pink:#ff6b9d;--blue:#3f8cff;--yellow:#ffc933;--green:#37c486;--red:#ff5a5f;--purple:#8e6bff;--shadow:0 6px 18px #0003}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd8ff;color:var(--ink);
 font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;touch-action:none;user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;border:0;cursor:pointer;color:#fff;font-weight:800;border-radius:14px;padding:10px 18px;background:var(--blue);box-shadow:0 4px 0 #0003;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}
button:disabled{opacity:.45;cursor:default}
button.alt{background:#fff;color:var(--ink)}
button.pink{background:var(--pink)}button.gold{background:#f2a900}button.green{background:var(--green)}button.red{background:var(--red)}
.hidden{display:none!important}
.panel{background:#fffdf7ee;border-radius:16px;box-shadow:var(--shadow);padding:8px 10px;border:3px solid #fff}

/* ---- title ---- */
#titleScr{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(#ffffff00,#ffffff00 60%,#ffffff55);overflow:auto;padding:12px}
#titleBox{max-width:560px;width:100%;text-align:center}
#logo{font-size:clamp(40px,10vw,76px);font-weight:900;letter-spacing:.06em;color:#fff;
 text-shadow:0 4px 0 #ff6b9d,0 8px 0 #3f8cff,0 12px 16px #0004;margin:0}
#sub{margin:8px 0 14px;font-weight:700}
#setupBox{padding:14px}
.cnt button{margin:3px;padding:8px 16px}.cnt button.on{background:var(--pink)}
.prow{display:flex;gap:8px;align-items:center;margin:6px 0}
.prow .dot{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 5px #0004;flex:none}
.prow input{flex:1;min-width:0;font:inherit;padding:8px;border-radius:10px;border:2px solid #ddd}
.prow button{padding:7px 12px;min-width:76px}
#avGender button{margin:2px;padding:6px 10px;font-size:.85rem}
.sw span{display:inline-block;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 5px #0004;margin:3px;cursor:pointer}
.sw span.sel{outline:3px solid #3b2f4a}.sw span.dis{opacity:.2;pointer-events:none}
.prow.selrow{background:#fff3c4;border-radius:12px}
.prow button[data-av]{padding:7px 10px;min-width:0}
#homeBox,#lobbyBox{padding:14px}
button.big{width:100%;font-size:1.15rem;padding:14px;margin:6px 0}
.orline{display:flex;align-items:center;gap:8px;color:#998;font-size:.8rem;margin:6px 0}
.orline:before,.orline:after{content:"";flex:1;border-top:2px dashed #ddd}
#olCode{width:100%;font:inherit;font-size:1.3rem;text-align:center;letter-spacing:.25em;padding:12px;border-radius:12px;border:2px solid #ddd;margin-bottom:6px}
#olCode::placeholder{letter-spacing:0;font-size:1rem}
#olMsg,#lbMsg{color:#c4202a;font-size:.85rem;margin-top:6px;min-height:1.2em}
#lbMsg{color:#665}
.codebox{margin:8px 0;padding:8px;border-radius:14px;background:#fff3c4}
.codebox span{display:block;font-size:.75rem;font-weight:800;color:#887}.codebox b{font-size:2.2rem;letter-spacing:.2em;color:#ff4f86}
.copyrow{display:flex;gap:8px;margin:6px 0}.copyrow button{flex:1;padding:10px 6px;font-size:.85rem}
#lbMembers{margin:8px 0}
.mem{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:12px;background:#faf6ee;margin:4px 0;text-align:left}
.mem.me{box-shadow:inset 0 0 0 2px #f2a900;background:#fff7dc}
.mem img{border-radius:8px;background:#eaf6ff;flex:none}.mem small{display:block;color:#887;font-size:.7rem}
.mem .st{margin-left:auto;font-weight:900;font-size:.8rem;padding:4px 10px;border-radius:12px;background:#eee;color:#887;white-space:nowrap}
.mem .st.ok{background:#bdf0c9;color:#0a7a45}
#avIcon{position:fixed;top:10px;right:10px;z-index:60;background:#fffdf7ee;color:#3b2f4a;border:3px solid #fff;border-radius:18px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2;box-shadow:var(--shadow)}
#avIcon img{border-radius:10px;background:#eaf6ff}#avIcon span{font-size:.75rem;font-weight:900}#avIcon small{font-size:.62rem;color:#887}
#avModal{position:fixed;inset:0;z-index:70;background:#0006;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
#avModal .panel{max-width:520px;width:100%}
#rulesTxt{font-size:.8rem;text-align:left;margin-top:8px;line-height:1.6;color:#665}

/* ---- HUD ---- */
#hudR{position:fixed;top:8px;right:8px;z-index:10;width:min(250px,44vw)}
#money{font-size:clamp(20px,4.2vw,30px);font-weight:900;font-variant-numeric:tabular-nums;transition:color .2s}
#money.up{color:#0a9d5a;text-shadow:0 0 8px #3f9}#money.down{color:#e02d3a;text-shadow:0 0 8px #f77}
#hudR .small{font-size:.78rem;line-height:1.5}
#hudName{font-weight:900}
#left{position:fixed;top:8px;left:8px;z-index:10;width:min(214px,34vw);max-height:56vh;overflow:auto}
.pl{display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:10px;margin-bottom:3px;font-size:.78rem}
.pl.cur{background:#fff0b8;box-shadow:inset 0 0 0 2px #f2a900}
.pl.fin{opacity:.6}
.pl .dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 1px 3px #0005}
.pl .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.pl .as{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
#leftTitle{font-weight:900;font-size:.8rem;margin-bottom:3px}
#tools{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:11;display:flex;gap:6px}
#tools button{padding:7px 12px;font-size:.8rem}
#actions{position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(92vw,560px)}
#spinBtn.stop{background:linear-gradient(#7fe3a8,#1fb36a);animation:pulse .5s infinite}
.age{font-size:.8rem;font-weight:800;color:#e8730c;margin-left:4px;white-space:nowrap}
.pl .ag{color:#e8730c;font-weight:800;font-size:.68rem;white-space:nowrap}
#spinBtn{font-size:clamp(18px,4vw,26px);padding:14px 34px;border-radius:40px;background:linear-gradient(#ff8fb4,#ff4f86);animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#toast{background:#3b2f4aee;color:#fff;padding:8px 16px;border-radius:20px;font-weight:700;font-size:.9rem;max-width:100%;text-align:center;transition:opacity .3s}
#hand{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));overflow-x:auto;background:linear-gradient(transparent,#0003);min-height:124px;align-items:flex-end}
.hc{flex:none;width:76px;height:92px;border-radius:12px;border:3px solid #fff;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer;font-size:.66rem;font-weight:800;text-align:center;line-height:1.25;background:#fff}
.hc .tt{position:absolute;left:0;right:0;bottom:0;padding:2px;background:#fffc}
.hc img{width:100%;height:60px;object-fit:cover;display:block}
.hc.job{background:#bfe6ff}.hc.job.sp{background:#ffe08a}
.hc.ins{background:#9cc4ff}.hc.use{background:#c9b4ff}.hc.col{background:#ffd966}
.hc.house{width:104px;background:#ffe9c9}.hc.stock{background:#bdf0c9;border-color:#e6b800}
.hc .big{font-size:1.8rem;font-weight:900;padding-top:14px}
.hc .ic{font-size:1.7rem;padding-top:10px}
#hand .hg{flex:none;display:flex;flex-direction:column;gap:2px;padding-right:2px}
#hand .hl{font-size:.64rem;font-weight:900;color:#fff;text-shadow:0 1px 3px #000c;padding-left:4px;white-space:nowrap}
#hand .hrow{display:flex;gap:6px}
.hc.wallet{width:238px;background:#fff7dc;padding:4px 4px 2px;text-align:left}
.hc.wallet .wt{font-size:.95rem;font-weight:900;color:#3b2f4a;padding:0 2px 2px;font-variant-numeric:tabular-nums}
.hc.wallet .wb{display:flex;gap:3px}
.hc.wallet .wi{flex:1;text-align:center}.hc.wallet .wi img{width:100%;display:block;height:auto;border-radius:3px;box-shadow:0 1px 2px #0004}
.hc.wallet .wi b{font-size:.68rem;color:#3b2f4a}.hc.wallet .wi.zero{opacity:.28}
.stack{cursor:pointer;--w:76px;--off:16px;--n:2;position:relative;height:92px;width:calc(var(--w) + (var(--n) - 1) * var(--off));transition:width .25s}
.stack.wide{--w:104px}
.stack .hc{position:absolute;top:0;left:calc(var(--i) * var(--off));transition:left .25s,transform .15s}
.hc .cnt{position:absolute;top:2px;right:2px;background:#3b2f4a;color:#fff;border-radius:10px;padding:0 6px;font-size:.62rem;font-weight:900;z-index:2}
.gc{background:#fff;color:#3b2f4a;border-radius:8px;padding:0 5px;font-size:.6rem}
.hc.empty{background:#e8e4f0;cursor:default}.hc.note{background:#ffd6d6;border-color:#e8454c}
#handEmpty{color:#fff;text-shadow:0 1px 3px #000;font-weight:700}

/* ---- card modal ---- */
#cardWrap{position:fixed;inset:0;z-index:30;background:#0004;display:flex;align-items:center;justify-content:center;padding:12px}
#card{width:min(400px,94vw);border-radius:22px;background:var(--card);box-shadow:0 12px 40px #0006;overflow:hidden;border:5px solid #fff;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#cardHead{padding:8px 14px;color:#fff;font-weight:900;font-size:.95rem;letter-spacing:.05em}
#cardBody{padding:14px 16px 6px;text-align:center;font-size:1.02rem;line-height:1.6;max-height:48vh;overflow:auto}
#cardTitle{font-size:1.3rem;font-weight:900;margin-bottom:6px}
#cardAmt{font-size:1.6rem;font-weight:900;margin:4px 0}
.plus{color:#0a9d5a}.minus{color:#e02d3a}
#cardBtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px 14px 16px}
#cardBtns button{flex:1 1 40%;min-width:110px}
#cardBtns.col button{flex:1 1 100%}
#cardImg{display:block;margin:4px auto;max-width:100%;border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}.tbl td,.tbl th{white-space:nowrap}.tbl td,.tbl th{padding:4px 6px;border-bottom:1px solid #eee;text-align:right}.tbl td:first-child,.tbl th:first-child{text-align:left}
#cardWrap.spec{background:transparent;pointer-events:none;align-items:flex-start;padding-top:70px}
#cardWrap.spec #card{transform:scale(.82);transform-origin:top center;opacity:.95}
#cardWrap.spec #cardBtns{display:none}
.slotrow{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:10px;background:#faf6ee;margin:3px 0;text-align:left}
.slotrow .dot{width:18px;height:18px;border-radius:50%;flex:none}
.slotrow .tag{margin-left:auto;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:10px;background:#ddd}
#card.wide{width:min(540px,96vw)}
#card.wide #cardBody{padding:8px 12px 0}
#card.wide #cardTitle{font-size:1.05rem;margin-bottom:2px}
#card.wide #cardText{font-size:.78rem}
#card.wide #cardBtns{padding:6px 10px 12px}
#cardBtns{max-height:68vh;overflow:auto}
#cardBtns button.prof{display:flex;gap:10px;align-items:center;text-align:left;background:#fff7f0;color:#3b2f4a;border:3px solid #ffd0e0;box-shadow:0 3px 0 #0002;font-weight:700;font-size:.76rem;line-height:1.4;padding:6px 8px;gap:8px}
#cardBtns button.prof:hover{background:#ffeaf2;border-color:#ff6fa5}
.pimg.emo{display:flex;align-items:center;justify-content:center;font-size:2.3rem}
.ptag{display:inline-block;font-size:.62rem;font-weight:900;padding:0 6px;border-radius:8px;background:#ffe27a;color:#7a5a00;vertical-align:middle}
.pimg{width:70px;height:62px;object-fit:cover;border-radius:10px;background:#eaf6ff;flex:none}
.pi{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}.pi small{font-weight:800}.pi .stars{font-size:.7rem;color:#c98a00;letter-spacing:-.02em}
.zoomprof{display:flex;gap:10px;align-items:center;text-align:left;font-size:.85rem;line-height:1.5}
.hc.mate{background:#ffe4ef}
#turnBanner{position:fixed;left:0;right:0;top:30%;z-index:26;display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none;animation:tb 1.9s ease-out forwards}
#turnBanner .tb-n{color:#fff;font-weight:900;font-size:clamp(26px,7vw,52px);padding:6px 22px;border-radius:40px;border:5px solid #fff;box-shadow:0 8px 0 #0003;text-shadow:0 3px 0 #0003}
#turnBanner .tb-t{color:#fff;font-weight:900;font-size:clamp(28px,8vw,60px);text-shadow:0 4px 0 #ff6b9d,0 8px 14px #0006;letter-spacing:.05em}
@keyframes tb{0%{opacity:0;transform:translateX(-70vw) scale(.8)}18%{opacity:1;transform:translateX(0) scale(1.08)}28%{transform:scale(1)}80%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(60vw)}}
#testPanel{position:fixed;top:48px;left:8px;z-index:40;width:min(340px,94vw);max-height:76vh;overflow:auto;font-size:.8rem;border:3px solid #8e6bff}
#testPanel .th{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:2px}
#testPanel .th button{padding:2px 10px}
#testPanel .tn{color:#887;font-size:.7rem;margin-bottom:4px}
#testPanel .tsec{font-weight:900;margin:8px 0 3px;color:#6a4fd0}
#testPanel .tgrid{display:flex;flex-wrap:wrap;gap:4px}
#testPanel .tgrid button,#testPanel .trow button{padding:5px 8px;font-size:.72rem;border-radius:9px}
#testPanel .trow{display:flex;gap:4px}#testPanel select,#testPanel input[type=text]{flex:1;min-width:0;font:inherit;padding:4px;border-radius:8px;border:2px solid #ddd}
#groupPop{position:fixed;inset:0;z-index:36;background:#0006;display:flex;align-items:center;justify-content:center;padding:12px}
#groupPop .gp{width:min(560px,96vw);max-height:80vh;overflow:auto;border:3px solid #fff}
#groupPop .gph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:1rem}
#groupPop .gph button{padding:6px 14px}
#gpGrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#gpGrid .hc{position:relative;width:96px;height:112px;flex:none}
#gpGrid .hc.house{width:120px}#gpGrid .hc img{height:76px}
.chartwrap{margin:8px 0;text-align:left}.chartwrap canvas{width:100%;height:auto;border-radius:10px;border:2px solid #eee;display:block;margin-top:2px}
.hp{font-size:.8rem;font-weight:800;color:#c4571f;margin-left:3px;white-space:nowrap}
#cardBody .rkrow{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px}
.rk{flex:1;border-radius:12px;padding:4px;background:#f2f2f8;border:3px solid #ddd}.rk.on{background:#fff6d6;border-color:#f2a900}.rk.off{opacity:.55}
.rk .rkh{font-size:.7rem;font-weight:900;color:#887}.rk.on .rkh{color:#c98a00}.rk .rkn{font-weight:900;font-size:.9rem}.rk .rks{font-size:.72rem}.rkarr{font-weight:900;color:#c98a00}
.hc.ranked{border-color:#f2a900;box-shadow:0 0 0 3px #ffe27a,var(--shadow)}
.hc.ticket{background:#fff3b0;border-color:#e6a800}.hc .cnt{white-space:nowrap}
#bonText{position:fixed;left:0;right:0;top:26%;z-index:27;text-align:center;font-size:clamp(70px,22vw,170px);font-weight:900;color:#ffe14a;-webkit-text-stroke:6px #c4202a;paint-order:stroke fill;text-shadow:0 8px 0 #7a1a1a,0 14px 24px #0006;pointer-events:none;animation:bon 1.5s ease-out forwards}
@keyframes bon{0%{opacity:0;transform:scale(.2) rotate(-14deg)}12%{opacity:1;transform:scale(1.5) rotate(5deg)}25%{transform:scale(.95) rotate(-3deg)}40%{transform:scale(1.1) rotate(2deg)}70%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(1.25) translateY(-30px)}}
#banner{position:fixed;left:0;right:0;top:34%;z-index:25;text-align:center;font-size:clamp(26px,7vw,54px);font-weight:900;color:#fff;
 text-shadow:0 4px 0 #ff6b9d,0 8px 14px #0006;pointer-events:none;animation:ban 2.4s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#logBox{position:fixed;left:8px;bottom:140px;z-index:11;width:min(300px,60vw);max-height:30vh;overflow:auto;font-size:.74rem;line-height:1.5}
#logBox div{border-bottom:1px dashed #ddd;padding:2px 0}
@media(max-width:640px){
 #left{width:170px;max-height:34vh}.pl .nm{max-width:40px}
 #hudR{width:150px}#tools{top:auto;bottom:calc(228px + env(safe-area-inset-bottom));left:8px;transform:none;flex-direction:column}
 #actions{bottom:calc(132px + env(safe-area-inset-bottom))}
 .hc{width:66px;height:84px}.hc.house{width:92px}.hc.wallet{width:210px}.stack{--w:66px;height:84px}.stack.wide{--w:92px}
}
</style>
</head>
<body>
<div id="stage"></div>

<div id="titleScr">
 <div id="titleBox">
  <h1 id="logo">LIFE ROAD</h1>
  <div id="sub">🚗 みんなで遊ぶ、オンライン人生すごろく 🚗</div>
  <div class="panel" id="homeBox">
   <button id="olHost" class="pink big">🏠 ルームを作る</button>
   <div class="orline"><span>または</span></div>
   <input id="olCode" type="text" inputmode="numeric" maxlength="6" placeholder="6桁のルームコードを入力" autocomplete="off">
   <button id="olJoin" class="gold big">🚪 ルームに参加する</button>
   <div id="olMsg"></div>
   <div id="rulesTxt">
    ルーレット(1〜10)を回して車を進め、ゴール時の<b>総資産</b>がいちばん多い人が勝ち（2〜6人）。<br>
    ・黄=給料日(通過でもOK) ・緑=ラッキー ・赤=ピンチ ・青=イベント ・金=STOP(必ず止まる)<br>
    ・お金が足りないと自動で<b>約束手形</b>(20,000円借りて25,000円返す)。 ・ドラッグで回転／ホイール・ピンチでズーム。
   </div>
  </div>
  <div class="panel hidden" id="lobbyBox">
   <div style="font-weight:900;font-size:1.1rem">🛋 待機ルーム</div>
   <div class="codebox"><span>ルームコード</span><b id="lbCode"></b></div>
   <div class="copyrow"><button id="lbCopyCode" class="alt">📋 コードをコピー</button><button id="lbCopyLink" class="alt">🔗 招待リンクをコピー</button></div>
   <div id="lbMembers"></div>
   <div class="copyrow"><button id="lbAvatar" class="gold">🎨 アバター変更</button><button id="lbReady" class="green">✅ OK</button></div>
   <button id="lbStart" class="pink big" disabled>スタート</button>
   <label id="lbTestWrap" class="hidden" style="display:block;font-size:.8rem;margin:6px 0;color:#665"><input type="checkbox" id="lbTest"> 🧪 テストモード（確認用ボタンが使える・1人でも開始OK）</label>
   <div id="lbMsg"></div>
   <button id="lbLeave" class="alt" style="margin-top:6px">ルームから出る</button>
  </div>
 </div>
 <button id="avIcon" title="アバター設定"><img id="avIconImg" width="54" height="38" alt=""><span id="avIconName"></span><small>⚙ アバター設定</small></button>
</div>

<div id="avModal" class="hidden">
 <div class="panel" id="avatarBox">
  <div style="font-weight:900;font-size:1.1rem;margin-bottom:6px">🎨 アバター設定</div>
  <div class="prow"><span>名前</span><input id="avName" type="text" maxlength="8" value="あなた"></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center">
   <img id="avPrev" width="200" height="142" alt="アバターのプレビュー" style="background:#eaf6ff99;border-radius:14px">
   <div style="flex:1;min-width:210px;text-align:left">
    <div style="font-size:.8rem;font-weight:800">せいべつ</div><div id="avGender" class="gbtn"></div>
    <div style="font-size:.8rem;font-weight:800;margin-top:6px">服の色</div><div id="swCloth" class="sw"></div>
    <div style="font-size:.8rem;font-weight:800;margin-top:6px">車の色</div><div id="swCar" class="sw"></div>
   </div>
  </div>
  <button id="avDone" class="pink big" style="margin-top:8px">OK</button>
 </div>
</div>

<div id="tools" class="hidden">
