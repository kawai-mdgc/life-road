<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIFE ROAD</title>
<style>
:root{--ink:#3b2f4a;--card:#fffdf7;--pink:#ff6b9d;--blue:#3f8cff;--yellow:#ffc933;--green:#37c486;--red:#ff5a5f;--purple:#8e6bff;--shadow:0 6px 18px #0003}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd8ff;color:var(--ink);
 font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;touch-action:none;user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;border:0;cursor:pointer;color:#fff;font-weight:800;border-radius:14px;padding:10px 18px;background:var(--blue);box-shadow:0 4px 0 #0003;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}
button:disabled{opacity:.45;cursor:default}
button.alt{background:#fff;color:var(--ink)}
button.pink{background:var(--pink)}button.gold{background:#f2a900}button.green{background:var(--green)}button.red{background:var(--red)}
.hidden{display:none!important}
.panel{background:#fffdf7ee;border-radius:16px;box-shadow:var(--shadow);padding:8px 10px;border:3px solid #fff}

/* ---- title ---- */
#titleScr{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(#ffffff00,#ffffff00 60%,#ffffff55);overflow:auto;padding:12px}
#titleBox{max-width:560px;width:100%;text-align:center}
#logo{font-size:clamp(40px,10vw,76px);font-weight:900;letter-spacing:.06em;color:#fff;
 text-shadow:0 4px 0 #ff6b9d,0 8px 0 #3f8cff,0 12px 16px #0004;margin:0}
#sub{margin:8px 0 14px;font-weight:700}
#setupBox{padding:14px}
.cnt button{margin:3px;padding:8px 16px}.cnt button.on{background:var(--pink)}
.prow{display:flex;gap:8px;align-items:center;margin:6px 0}
.prow .dot{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 5px #0004;flex:none}
.prow input{flex:1;min-width:0;font:inherit;padding:8px;border-radius:10px;border:2px solid #ddd}
.prow button{padding:7px 12px;min-width:76px}
#rulesTxt{font-size:.8rem;text-align:left;margin-top:8px;line-height:1.6;color:#665}

/* ---- HUD ---- */
#hudR{position:fixed;top:8px;right:8px;z-index:10;width:min(250px,44vw)}
#money{font-size:clamp(20px,4.2vw,30px);font-weight:900;font-variant-numeric:tabular-nums;transition:color .2s}
#money.up{color:#0a9d5a;text-shadow:0 0 8px #3f9}#money.down{color:#e02d3a;text-shadow:0 0 8px #f77}
#hudR .small{font-size:.78rem;line-height:1.5}
#hudName{font-weight:900}
#left{position:fixed;top:8px;left:8px;z-index:10;width:min(214px,34vw);max-height:56vh;overflow:auto}
.pl{display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:10px;margin-bottom:3px;font-size:.78rem}
.pl.cur{background:#fff0b8;box-shadow:inset 0 0 0 2px #f2a900}
.pl.fin{opacity:.6}
.pl .dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 1px 3px #0005}
.pl .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.pl .as{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
#leftTitle{font-weight:900;font-size:.8rem;margin-bottom:3px}
#tools{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:11;display:flex;gap:6px}
#tools button{padding:7px 12px;font-size:.8rem}
#actions{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(92vw,560px)}
#spinBtn{font-size:clamp(18px,4vw,26px);padding:14px 34px;border-radius:40px;background:linear-gradient(#ff8fb4,#ff4f86);animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#toast{background:#3b2f4aee;color:#fff;padding:8px 16px;border-radius:20px;font-weight:700;font-size:.9rem;max-width:100%;text-align:center;transition:opacity .3s}
#hand{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));overflow-x:auto;background:linear-gradient(transparent,#0003);min-height:104px;align-items:flex-end}
.hc{flex:none;width:76px;height:92px;border-radius:12px;border:3px solid #fff;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer;font-size:.66rem;font-weight:800;text-align:center;line-height:1.25;background:#fff}
.hc .tt{position:absolute;left:0;right:0;bottom:0;padding:2px;background:#fffc}
.hc img{width:100%;height:60px;object-fit:cover;display:block}
.hc.job{background:#bfe6ff}.hc.job.sp{background:#ffe08a}
.hc.ins{background:#9cc4ff}.hc.use{background:#c9b4ff}.hc.col{background:#ffd966}
.hc.house{width:104px;background:#ffe9c9}.hc.stock{background:#bdf0c9;border-color:#e6b800}
.hc .big{font-size:1.8rem;font-weight:900;padding-top:14px}
.hc .ic{font-size:1.7rem;padding-top:10px}
#handEmpty{color:#fff;text-shadow:0 1px 3px #000;font-weight:700}

/* ---- card modal ---- */
#cardWrap{position:fixed;inset:0;z-index:30;background:#0004;display:flex;align-items:center;justify-content:center;padding:12px}
#card{width:min(400px,94vw);border-radius:22px;background:var(--card);box-shadow:0 12px 40px #0006;overflow:hidden;border:5px solid #fff;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#cardHead{padding:8px 14px;color:#fff;font-weight:900;font-size:.95rem;letter-spacing:.05em}
#cardBody{padding:14px 16px 6px;text-align:center;font-size:1.02rem;line-height:1.6;max-height:48vh;overflow:auto}
#cardTitle{font-size:1.3rem;font-weight:900;margin-bottom:6px}
#cardAmt{font-size:1.6rem;font-weight:900;margin:4px 0}
.plus{color:#0a9d5a}.minus{color:#e02d3a}
#cardBtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px 14px 16px}
#cardBtns button{flex:1 1 40%;min-width:110px}
#cardBtns.col button{flex:1 1 100%}
#cardImg{display:block;margin:4px auto;max-width:100%;border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}.tbl td,.tbl th{padding:4px 6px;border-bottom:1px solid #eee;text-align:right}.tbl td:first-child,.tbl th:first-child{text-align:left}
#banner{position:fixed;left:0;right:0;top:34%;z-index:25;text-align:center;font-size:clamp(26px,7vw,54px);font-weight:900;color:#fff;
 text-shadow:0 4px 0 #ff6b9d,0 8px 14px #0006;pointer-events:none;animation:ban 2.4s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#logBox{position:fixed;left:8px;bottom:120px;z-index:11;width:min(300px,60vw);max-height:30vh;overflow:auto;font-size:.74rem;line-height:1.5}
#logBox div{border-bottom:1px dashed #ddd;padding:2px 0}
@media(max-width:640px){
 #left{width:150px;max-height:34vh}.pl .nm{max-width:48px}
 #hudR{width:150px}#tools{top:auto;bottom:calc(206px + env(safe-area-inset-bottom));left:8px;transform:none;flex-direction:column}
 #actions{bottom:calc(112px + env(safe-area-inset-bottom))}
 .hc{width:66px;height:84px}.hc.house{width:92px}
}
</style>
</head>
<body>
<div id="stage"></div>

<div id="titleScr">
 <div id="titleBox">
  <h1 id="logo">LIFE ROAD</h1>
  <div id="sub">🚗 誕生から引退まで、190マスの人生すごろく 🚗</div>
  <div class="panel" id="setupBox">
   <div style="font-weight:900">遊ぶ人数</div>
   <div class="cnt" id="cnt"></div>
   <div id="prows"></div>
   <button id="startBtn" class="pink" style="margin-top:10px;font-size:1.2rem;padding:12px 40px">スタート！</button>
   <div id="rulesTxt">
    ルーレット(1〜10)を回して車を進め、ゴール時の<b>総資産</b>がいちばん多い人が勝ち。<br>
    ・黄=給料日(通過でもOK) ・緑=ラッキー ・赤=ピンチ ・青=イベント ・金=STOP(必ず止まる)<br>
    ・お金が足りないと自動で<b>約束手形</b>(20,000借りて25,000返す)。 ・ドラッグで回転／ホイール・ピンチでズーム。
   </div>
  </div>
 </div>
</div>

<div id="tools" class="hidden">
 <button id="btn2d" class="alt">🗺 2D表示</button>
 <button id="btnSnd" class="alt">🔊</button>
 <button id="btnSpd" class="alt">⏩ ×1</button>
 <button id="btnLog" class="alt">📜</button>
</div>
<div id="left" class="panel hidden"><div id="leftTitle">プレイヤー（総資産）</div><div id="plist"></div></div>
<div id="hudR" class="panel hidden">
 <div id="hudName">-</div>
 <div id="money">0 LD</div>
 <div class="small" id="hudNote"></div>
 <div class="small" id="hudJob"></div>
 <div class="small" id="hudFam"></div>
</div>
<div id="actions" class="hidden">
 <div id="toast" style="opacity:0"></div>
 <button id="spinBtn" class="hidden">🎯 ルーレットを回す</button>
</div>
<div id="hand" class="hidden"></div>
<div id="logBox" class="panel hidden"></div>

<div id="cardWrap" class="hidden"><div id="card">
 <div id="cardHead"></div>
 <div id="cardBody"><div id="cardTitle"></div><div id="cardText"></div><canvas id="cardImg" width="1" height="1" class="hidden"></canvas><div id="cardAmt"></div></div>
 <div id="cardBtns"></div>
</div></div>
<div id="banner" class="hidden"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
